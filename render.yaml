services:
  - type: web
    name: my-scan-doc-bff
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: BFF_COOKIE_SECURE
        value: "true"
      # Utilisateur unique du site (hash BCrypt, jamais le mot de passe en clair)
      - key: BFF_USERNAME
        sync: false
      - key: BFF_PASSWORD_HASH
        sync: false
      # Compte de service pour appeler my-scan-doc-api
      - key: API_BASE_URL
        sync: false   # ex. https://my-scan-doc-api.onrender.com
      - key: API_SERVICE_USERNAME
        sync: false
      - key: API_SERVICE_PASSWORD
        sync: false
