name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: BFF - tests + couverture (JaCoCo 90 %)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: mvn verify
        run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapports-tests-bff
          path: |
            target/surefire-reports
            target/site/jacoco
          retention-days: 7

  frontend:
    name: Front Angular - tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  docker:
    name: Build de l'image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: my-scan-doc-bff:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan Trivy (CRITICAL/HIGH corrigeables)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity CRITICAL,HIGH --ignore-unfixed \
            --exit-code 1 --no-progress my-scan-doc-bff:ci
